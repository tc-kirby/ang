<html>
    <head>
        <title>Ang</title>
        <script src = "./ang.js"></script>
        <script src = "./dict.js"></script>

        <link rel="stylesheet" href="style.css">
        <link href='https://fonts.googleapis.com/css?family=Abel' rel='stylesheet'>

        <script>
            var anagramQueue = [];
            var workerDone = false;
            var workerDoneData = null;
            
            // Virtual scrolling configuration
            const ITEM_HEIGHT = 25; // Height of each anagram item in pixels
            const BUFFER_SIZE = 20; // Number of extra items to render above/below viewport
            let scrollRAF = null;
            
            // Virtual scrolling function to render only visible items
            function updateVirtualScroll() {
                const container = document.getElementById("output_container");
                const viewport = document.getElementById("output_viewport");
                const spacer = document.getElementById("output_spacer");
                
                if (!container || !viewport || !spacer) return;
                
                const scrollTop = container.scrollTop;
                const containerHeight = container.clientHeight;
                
                // Calculate total height needed for all items
                const totalHeight = anagramQueue.length * ITEM_HEIGHT;
                spacer.style.height = totalHeight + 'px';
                
                // Calculate which items should be visible
                const startIndex = Math.max(0, Math.floor(scrollTop / ITEM_HEIGHT) - BUFFER_SIZE);
                const endIndex = Math.min(
                    anagramQueue.length,
                    Math.ceil((scrollTop + containerHeight) / ITEM_HEIGHT) + BUFFER_SIZE
                );
                
                // Clear and render only visible items
                viewport.innerHTML = '';
                
                for (let i = startIndex; i < endIndex; i++) {
                    const item = document.createElement('div');
                    item.className = 'anagram-item';
                    item.style.position = 'absolute';
                    item.style.top = (i * ITEM_HEIGHT) + 'px';
                    item.style.height = ITEM_HEIGHT + 'px';
                    item.style.width = '100%';
                    item.textContent = anagramQueue[i];
                    viewport.appendChild(item);
                }
            }
            
            // Handle scroll events with requestAnimationFrame for smooth performance
            function onScroll() {
                if (scrollRAF) {
                    cancelAnimationFrame(scrollRAF);
                }
                scrollRAF = requestAnimationFrame(updateVirtualScroll);
            }

            function msg_from_worker(e) {
                const worker_data = e.data;

                if(worker_data.the_status == "results") {
                    // Add results to queue (using push with spread operator for better performance)
                    anagramQueue.push(...worker_data.anagrams);
                    
                    // Update virtual scroll display
                    updateVirtualScroll();
                }
                else if(worker_data.the_status == "done") {
                    workerDone = true;
                    workerDoneData = worker_data;
                    
                    // Update final status
                    document.getElementById("status").innerHTML = `Found ${worker_data.n_anagrams} anagrams of <i>${worker_data.phrase}</i> in ${worker_data.total_seconds} seconds.`;
                    document.getElementById("find_button").disabled = false;
                }
            }

            function button_click() {
                var phrase = document.getElementById("user_input").value;
                var mw_value = document.getElementById("max_words_dropdown").value;

                // Reset state for new search
                anagramQueue = [];
                workerDone = false;
                workerDoneData = null;

                const ang_worker = new Worker('ang.js');

                ang_worker.onmessage = msg_from_worker;

                if(mw_value != 'unlimited') {
                    var max_words = parseInt(mw_value);
                    var the_status = `Finding anagrams of <i>${phrase}</i> containing no more than ${max_words} words...`
                    
                }
                else {
                    var max_words = null;
                    var the_status = `Finding anagrams of <i>${phrase}</i>...`
                }

                document.getElementById("status").innerHTML = the_status; // set placeholder status while we work...
                
                // Clear the virtual scroll container
                const viewport = document.getElementById("output_viewport");
                const spacer = document.getElementById("output_spacer");
                if (viewport) viewport.innerHTML = "";
                if (spacer) spacer.style.height = "0px";

                document.getElementById("find_button").disabled = true;

                ang_worker.postMessage({phrase: phrase, max_words: max_words, dict_words: get_words()});
            }

            function setup() {
                // make the button click if the user presses enter
                let button = document.getElementById("user_input");
                button.addEventListener("keyup", function(event) {
                    event.preventDefault();
                    if (event.keyCode === 13) {
                        document.getElementById("find_button").click();
                    }
                });
                
                // Set up scroll listener for virtual scrolling
                const container = document.getElementById("output_container");
                if (container) {
                    container.addEventListener("scroll", onScroll);
                }
            }

        </script>
    </head>
    
    <body onload = "setup()">
        <div id = "everything">
            <h1><i>Ang</i> anagram finder</h1>
            <div class="form_part"><input type="text" id="user_input" placeholder="text here"></div>
            <div class="form_part">Maximum number of words:
                <select id="max_words_dropdown">
                    <option value="unlimited">unlimited</option>
                    <option value="5">5</option>
                    <option value="4">4</option>
                    <option value="3">3</option>
                    <option value="2">2</option>
                    <option value="1">1</option>
                </select>
            </div>
            <div class="form_part">
                <input type="button" value="Find anagrams!" id="find_button" onclick="button_click();">
            </div>
            <div id="status"></div>
            <!-- Virtual scroll container -->
            <div id="output_container">
                <!-- Spacer maintains the total scrollable height (total_items × item_height) -->
                <div id="output_spacer">
                    <!-- Viewport contains only the currently visible items -->
                    <div id="output_viewport"></div>
                </div>
            </div>
        </div>
    </body>
</html>
