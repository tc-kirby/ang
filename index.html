<html>
    <head>
        <title>Ang</title>
        <script src = "./ang.js"></script>
        <script src = "./dict.js"></script>

        <link rel="stylesheet" href="style.css">
        <link href='https://fonts.googleapis.com/css?family=Abel' rel='stylesheet'>

        <script>
            var maxed_out = false;
            var anagramQueue = [];
            var isProcessing = false;
            var workerDone = false;
            var workerDoneData = null;
            const max_print = 150000;
            const BATCH_SIZE = 15;

            // Fallback for browsers that don't support requestIdleCallback
            const scheduleIdleCallback = window.requestIdleCallback || function(callback) {
                return setTimeout(callback, 1);
            };

            const cancelIdleCallback = window.cancelIdleCallback || function(id) {
                clearTimeout(id);
            };

            function processQueue(deadline) {
                const output_list = document.getElementById("output_list");
                let itemsProcessed = 0;

                // Process items while we have time and items in the queue
                while ((deadline.timeRemaining() > 0 || deadline.didTimeout) && 
                       anagramQueue.length > 0 && 
                       itemsProcessed < BATCH_SIZE &&
                       !maxed_out) {
                    
                    const anagram = anagramQueue.shift();
                    const node = document.createElement("div");
                    node.appendChild(document.createTextNode(anagram));
                    output_list.appendChild(node);
                    itemsProcessed++;

                    // Check if we've exceeded the max_print limit
                    if(output_list.getElementsByTagName('*').length > max_print) {
                        maxed_out = true;
                        const warningNode = document.createElement("div");
                        warningNode.appendChild(document.createTextNode(`[can't display more than ${max_print} anagrams without crashing the browser]`));
                        output_list.appendChild(warningNode);
                        // Clear remaining queue to stop processing
                        anagramQueue = [];
                    }
                }

                // If there are more items to process, schedule another callback
                if (anagramQueue.length > 0 && !maxed_out) {
                    scheduleIdleCallback(processQueue);
                } else {
                    // No more items in queue
                    isProcessing = false;
                    
                    // If worker is done and queue is empty, finalize
                    if (workerDone && workerDoneData) {
                        document.getElementById("status").innerHTML = `Found ${workerDoneData.n_anagrams} anagrams of <i>${workerDoneData.phrase}</i> in ${workerDoneData.total_seconds} seconds.`;
                        document.getElementById("find_button").disabled = false;
                        workerDone = false;
                        workerDoneData = null;
                    }
                }
            }

            function msg_from_worker(e) {
                const worker_data = e.data;

                if(worker_data.the_status == "results") {
                    console.log(maxed_out);

                    if(!maxed_out) {
                        // Add results to queue instead of immediately rendering
                        anagramQueue.push(...worker_data.anagrams);
                        
                        // Start processing if not already running
                        if (!isProcessing) {
                            isProcessing = true;
                            scheduleIdleCallback(processQueue);
                        }
                    }
                }
                else if(worker_data.the_status == "done") {
                    workerDone = true;
                    workerDoneData = worker_data;
                    
                    // If queue is empty, finalize immediately
                    if (anagramQueue.length === 0 && !isProcessing) {
                        document.getElementById("status").innerHTML = `Found ${worker_data.n_anagrams} anagrams of <i>${worker_data.phrase}</i> in ${worker_data.total_seconds} seconds.`;
                        document.getElementById("find_button").disabled = false;
                        workerDone = false;
                        workerDoneData = null;
                    }
                }
            }

            function button_click() {
                var phrase = document.getElementById("user_input").value;
                var mw_value = document.getElementById("max_words_dropdown").value;

                // Reset state for new search
                anagramQueue = [];
                isProcessing = false;
                workerDone = false;
                workerDoneData = null;
                maxed_out = false;

                const ang_worker = new Worker('ang.js');

                ang_worker.onmessage = msg_from_worker;

                if(mw_value != 'unlimited') {
                    var max_words = parseInt(mw_value);
                    var the_status = `Finding anagrams of <i>${phrase}</i> containing no more than ${max_words} words...`
                    
                }
                else {
                    var max_words = null;
                    var the_status = `Finding anagrams of <i>${phrase}</i>...`
                }

                document.getElementById("status").innerHTML = the_status; // set placeholder status while we work...
                document.getElementById("output_list").innerHTML = ""; // clear the output list space

                document.getElementById("find_button").disabled = true;

                ang_worker.postMessage({phrase: phrase, max_words: max_words, dict_words: get_words()});
            }

            function setup() {
                // make the button click if the user presses enter
                let button = document.getElementById("user_input");
                button.addEventListener("keyup", function(event) {
                    event.preventDefault();
                    if (event.keyCode === 13) {
                        document.getElementById("find_button").click();
                    }
                });
            }

        </script>
    </head>
    
    <body onload = "setup()">
        <div id = "everything">
            <h1><i>Ang</i> anagram finder</h1>
            <div class="form_part"><input type="text" id="user_input" placeholder="text here"></div>
            <div class="form_part">Maximum number of words:
                <select id="max_words_dropdown">
                    <option value="unlimited">unlimited</option>
                    <option value="5">5</option>
                    <option value="4">4</option>
                    <option value="3">3</option>
                    <option value="2">2</option>
                    <option value="1">1</option>
                </select>
            </div>
            <div class="form_part">
                <input type="button" value="Find anagrams!" id="find_button" onclick="button_click();">
            </div>
            <div id="status"></div>
            <div id="output_list"></div>
        </div>
    </body>
</html>
